<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resident Resources</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      padding: 24px;
    }
    .card {
      width: min(92%, 560px);
      background: white;
      padding: 46px 32px;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }
    p {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    a.button {
      display: block;
      padding: 15px 22px;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    a.button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Resident Resources</h1>
    <p>Select the spreadsheet you want to open.</p>
    <div class="buttons">
      <a class="button" href="https://docs.google.com/spreadsheets/d/1DAQbkXv3brQX1CloJIR3LBfqdGbxESFx/edit?usp=sharing&ouid=112539941941941132832&rtpof=true&sd=true" target="_blank" rel="noopener noreferrer">Master schedule, Annual Leave, and Mentors</a>
<a class="button" href="https://docs.google.com/spreadsheets/d/1QUiuc1nJjCv93rmzHOBFh9MDa4YiJkxMzKBH4OU81TA/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Resident's Talk list</a>
<a class="button" href="https://docs.google.com/spreadsheets/d/1TimPzVt2VvpcrdPizD-wPvv_s6o96Ta_J9V897F_QPY/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Academic day attendance and food</a>
      <a class="button" href="https://docs.google.com/spreadsheets/d/1oT4q-NZkdwJqG5I1Ivrpo_wG6a88L4cmG3Stp4U-BpQ/edit?gid=1944781830#gid=1944781830" target="_blank" rel="noopener noreferrer">Academic day 2025-2026 Plan and Schedule</a>
    </div>
  </main>
</body>
</html>
